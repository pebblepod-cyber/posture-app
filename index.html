<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>姿勢解析アプリ</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
    .container { position: relative; width: 100vw; max-width: 600px; margin: 0 auto; }
    video, canvas { width: 100%; height: auto; display: block; border-radius: 8px; }
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    .controls { padding: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button { padding: 12px 20px; font-size: 16px; border: none; border-radius: 8px; background: #00c853; color: #fff; font-weight: bold; cursor: pointer; }
    button#switchBtn { background: #2979ff; }
    #status { width: 100%; margin-top: 8px; font-size: 14px; color: #ffeb3b; }
  </style>
  <script src="https://googleapis.com"></script>
  <script src="https://jsdelivr.net"></script>
</head>
<body>
  <div class="controls">
    <button id="startBtn" onclick="startCamera()">カメラを開始</button>
    <button id="switchBtn" onclick="switchCamera()">前面 / 背面 切替</button>
    <div id="status">【Ver.5】AI準備中...</div>
  </div>
  <div class="container">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    let useFrontCamera = false;
    let currentStream = null;
    let detector = null;
    let isDetecting = false;

    const CONNECTIONS = [, [5, 7], [7, 9], [6, 8], [8, 10],
, [6, 12], [11, 12],
, [13, 15], [12, 14], [14, 16]
    ];

    window.onload = async () => {
      try {
        if (typeof poseDetection === 'undefined') {
          statusText.innerText = "【Ver.5】読込エラー：ブラウザの広告ブロック等をオフにしてお試しください";
          return;
        }
        statusText.innerText = "【Ver.5】Google骨格モデルを読み込み中...";
        detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, {
          modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
        });
        statusText.innerText = "【Ver.5】準備完了！「カメラを開始」を押してください";
      } catch (e) {
        statusText.innerText = "【Ver.5】モデルエラー: " + e.message;
      }
    };

    async function startCamera() {
      statusText.innerText = "カメラを起動中...";
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      const constraints = {
        video: { facingMode: useFrontCamera ? "user" : "environment" },
        audio: false
      };
      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        await video.play();
        if (!isDetecting) {
          isDetecting = true;
          detectLoop();
        }
      } catch (err) {
        statusText.innerText = "カメラエラー: " + err.message;
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      startCamera();
    }

    async function detectLoop() {
      if (detector && video.readyState >= 2) {
        try {
          const poses = await detector.estimatePoses(video);
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (poses.length > 0 && poses[0].keypoints) {
            statusText.innerText = "骨格を検知中！";
            const keypoints = poses[0].keypoints;

            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = 4;
            CONNECTIONS.forEach(([i, j]) => {
              const kp1 = keypoints[i];
              const kp2 = keypoints[j];
              if (kp1.score > 0.3 && kp2.score > 0.3) {
                ctx.beginPath();
                ctx.moveTo(kp1.x, kp1.y);
                ctx.lineTo(kp2.x, kp2.y);
                ctx.stroke();
              }
            });

            ctx.fillStyle = '#FF0000';
            keypoints.forEach(kp => {
              if (kp.score > 0.3) {
                ctx.beginPath();
                ctx.arc(kp.x, kp.y, 5, 0, 2 * Math.PI);
                ctx.fill();
              }
            });
          } else {
            statusText.innerText = "カメラに人を映してください";
          }
        } catch (e) {
          statusText.innerText = "解析エラー: " + e.message;
        }
      }
      requestAnimationFrame(detectLoop);
    }
  </script>
</body>
</html>
