<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>姿勢解析カメラ（完全検証済み版）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    .header { padding: 8px; background: #1e1e1e; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; z-index: 10; }
    button { padding: 9px 11px; font-size: 13px; border: none; border-radius: 8px; font-weight: bold; color: #fff; cursor: pointer; }
    #startBtn { background: #00c853; }
    #switchBtn { background: #2979ff; }
    #modeBtn { background: #ff9100; }
    #resetBtn { background: #607d8b; }
    #snapBtn { background: #e91e63; }
    .viewer { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; touch-action: none; }
    video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    canvas#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #status { width: 100%; text-align: center; font-size: 12px; color: #ffeb3b; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <button id="startBtn">カメラ開始</button>
    <button id="switchBtn">切替</button>
    <button id="modeBtn">モード：ガイド線</button>
    <button id="resetBtn">リセット</button>
    <button id="snapBtn">撮影保存</button>
    <div id="status">【完全動作版】「カメラ開始」を押してください</div>
  </div>

  <div class="viewer">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
  </div>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const statusText = document.getElementById('status');
    const modeBtn = document.getElementById('modeBtn');

    let useFront = false;
    let stream = null;
    let currentMode = 'grid';

    let centerXRatio = 0.5;
    let centerYRatio = 0.5;
    let isDragging = false;

    let pt1 = null;
    let pt2 = null;

    function drawPoint(targetCtx, pt, w, h, scaleFactor) {
      if (!pt) return;
      const px = pt.x * w;
      const py = pt.y * h;
      targetCtx.fillStyle = '#00e676';
      targetCtx.beginPath();
      targetCtx.arc(px, py, 8 * scaleFactor, 0, Math.PI * 2);
      targetCtx.fill();

      targetCtx.strokeStyle = '#fff';
      targetCtx.lineWidth = 2 * scaleFactor;
      targetCtx.stroke();
    }

    function renderOverlay(targetCtx, w, h, scaleFactor) {
      if (currentMode === 'off') return;

      if (currentMode === 'grid') {
        const cx = w * centerXRatio;
        const cy = h * centerYRatio;

        targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        targetCtx.lineWidth = 1 * scaleFactor;
        const step = 40 * scaleFactor;
        for (let x = cx; x < w; x += step) { targetCtx.beginPath(); targetCtx.moveTo(x, 0); targetCtx.lineTo(x, h); targetCtx.stroke(); }
        for (let x = cx; x > 0; x -= step) { targetCtx.beginPath(); targetCtx.moveTo(x, 0); targetCtx.lineTo(x, h); targetCtx.stroke(); }
        for (let y = cy; y < h; y += step) { targetCtx.beginPath(); targetCtx.moveTo(0, y); targetCtx.lineTo(w, y); targetCtx.stroke(); }
        for (let y = cy; y > 0; y -= step) { targetCtx.beginPath(); targetCtx.moveTo(0, y); targetCtx.lineTo(w, y); targetCtx.stroke(); }

        targetCtx.strokeStyle = 'rgba(255, 50, 50, 0.9)';
        targetCtx.lineWidth = 2 * scaleFactor;
        targetCtx.beginPath();
        targetCtx.moveTo(cx, 0); targetCtx.lineTo(cx, h);
        targetCtx.moveTo(0, cy); targetCtx.lineTo(w, cy);
        targetCtx.stroke();

        targetCtx.beginPath();
        targetCtx.arc(cx, cy, 12 * scaleFactor, 0, Math.PI * 2);
        targetCtx.stroke();
      }

      if (currentMode === 'angle') {
        drawPoint(targetCtx, pt1, w, h, scaleFactor);
        drawPoint(targetCtx, pt2, w, h, scaleFactor);

        if (pt1 && pt2) {
          const p1x = pt1.x * w;
          const p1y = pt1.y * h;
          const p2x = pt2.x * w;
          const p2y = pt2.y * h;

          targetCtx.strokeStyle = '#ffea00';
          targetCtx.lineWidth = 3 * scaleFactor;
          targetCtx.beginPath();
          targetCtx.moveTo(p1x, p1y);
          targetCtx.lineTo(p2x, p2y);
          targetCtx.stroke();

          targetCtx.setLineDash([6 * scaleFactor, 6 * scaleFactor]);
          targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
          targetCtx.lineWidth = 1.5 * scaleFactor;
          targetCtx.beginPath();
          targetCtx.moveTo(Math.min(p1x, p2x) - 30 * scaleFactor, p1y);
          targetCtx.lineTo(Math.max(p1x, p2x) + 30 * scaleFactor, p1y);
          targetCtx.stroke();
          targetCtx.setLineDash([]);

          const dx = Math.abs(p2x - p1x);
          const dy = Math.abs(p2y - p1y);
          let angleDeg = 0;
          let labelType = "";
          if (dx >= dy) {
            angleDeg = Math.atan2(dy, dx) * (180 / Math.PI);
            labelType = "水平傾き";
          } else {
            angleDeg = Math.atan2(dx, dy) * (180 / Math.PI);
            labelType = "垂直傾き";
          }

          const text = labelType + ": " + angleDeg.toFixed(1) + "°";
          const midX = (p1x + p2x) / 2;
          const midY = (p1y + p2y) / 2 - (20 * scaleFactor);

          targetCtx.font = "bold " + Math.round(16 * scaleFactor) + "px sans-serif";
          const textWidth = targetCtx.measureText(text).width;
          targetCtx.fillStyle = 'rgba(0, 0, 0, 0.75)';
          targetCtx.fillRect(midX - textWidth / 2 - 8 * scaleFactor, midY - 18 * scaleFactor, textWidth + 16 * scaleFactor, 26 * scaleFactor);

          targetCtx.fillStyle = '#ffea00';
          targetCtx.textAlign = 'center';
          targetCtx.fillText(text, midX, midY);
        }
      }
    }

    function drawScreen() {
      overlay.width = overlay.clientWidth;
      overlay.height = overlay.clientHeight;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      renderOverlay(ctx, overlay.width, overlay.height, 1);
    }

    overlay.addEventListener('pointerdown', function(e) {
      const rect = overlay.getBoundingClientRect();
      const rx = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const ry = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));

      if (currentMode === 'grid') {
        isDragging = true;
        centerXRatio = rx;
        centerYRatio = ry;
        drawScreen();
      } else if (currentMode === 'angle') {
        if (!pt1 || (pt1 && pt2)) {
          pt1 = { x: rx, y: ry };
          pt2 = null;
          statusText.innerText = "2点目をタップしてください";
        } else {
          pt2 = { x: rx, y: ry };
          statusText.innerText = "角度を計測しました（再タップでやり直し）";
        }
        drawScreen();
      }
    });

    overlay.addEventListener('pointermove', function(e) {
      if (!isDragging || currentMode !== 'grid') return;
      const rect = overlay.getBoundingClientRect();
      centerXRatio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      centerYRatio = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
      drawScreen();
    });

    overlay.addEventListener('pointerup', function() { isDragging = false; });
    overlay.addEventListener('pointercancel', function() { isDragging = false; });

    async function startCamera() {
      statusText.innerText = "カメラを起動中...";
      if (stream) {
        stream.getTracks().forEach(function(t) { t.stop(); });
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: useFront ? "user" : "environment" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        updateStatusGuide();
        drawScreen();
      } catch (err) {
        statusText.innerText = "カメラエラー: " + err.message;
      }
    }

    function updateStatusGuide() {
      if (currentMode === 'grid') statusText.innerText = "【ガイド線】画面をなぞって赤線を移動できます";
      if (currentMode === 'angle') statusText.innerText = "【角度計測】左右の肩など2点をタップしてください";
      if (currentMode === 'off') statusText.innerText = "【線なし】通常カメラ表示";
    }

    document.getElementById('startBtn').addEventListener('click', startCamera);
    document.getElementById('switchBtn').addEventListener('click', function() {
      useFront = !useFront;
      startCamera();
    });

    modeBtn.addEventListener('click', function() {
      if (currentMode === 'grid') {
        currentMode = 'angle';
        modeBtn.innerText = "モード：角度計測";
        modeBtn.style.background = "#00bfa5";
      } else if (currentMode === 'angle') {
        currentMode = 'off';
        modeBtn.innerText = "モード：線なし";
        modeBtn.style.background = "#757575";
      } else {
        currentMode = 'grid';
        modeBtn.innerText = "モード：ガイド線";
        modeBtn.style.background = "#ff9100";
      }
      updateStatusGuide();
      drawScreen();
    });

    document.getElementById('resetBtn').addEventListener('click', function() {
      centerXRatio = 0.5;
      centerYRatio = 0.5;
      pt1 = null;
      pt2 = null;
      drawScreen();
      statusText.innerText = "位置と計測点をリセットしました";
    });

    document.getElementById('snapBtn').addEventListener('click', function() {
      if (!video.videoWidth) {
        statusText.innerText = "先に「カメラ開始」を押してください";
        return;
      }
      const saveCanvas = document.createElement('canvas');
      saveCanvas.width = video.videoWidth;
      saveCanvas.height = video.videoHeight;
      const sCtx = saveCanvas.getContext('2d');
      sCtx.drawImage(video, 0, 0, saveCanvas.width, saveCanvas.height);

      const scale = Math.max(1, saveCanvas.width / 400);
      renderOverlay(sCtx, saveCanvas.width, saveCanvas.height, scale);
