<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>姿勢チェックカメラ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header { padding: 10px; background: #1e1e1e; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; z-index: 10; }
    button { padding: 10px 14px; font-size: 14px; border: none; border-radius: 6px; font-weight: bold; color: #fff; cursor: pointer; }
    #startBtn { background: #00c853; }
    #switchBtn { background: #2979ff; }
    #gridBtn { background: #ff9100; }
    #snapBtn { background: #e91e63; }
    .viewer { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; }
    canvas#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #status { width: 100%; text-align: center; font-size: 12px; color: #ffeb3b; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <button id="startBtn">カメラ開始</button>
    <button id="switchBtn">カメラ切替</button>
    <button id="gridBtn">ガイド線 ON/OFF</button>
    <button id="snapBtn">写真保存</button>
    <div id="status">【外部通信ゼロ版】「カメラ開始」を押してください</div>
  </div>

  <div class="viewer" id="viewer">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
  </div>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const statusText = document.getElementById('status');
    let useFront = false;
    let stream = null;
    let showGrid = true;

    function drawGrid() {
      overlay.width = overlay.clientWidth;
      overlay.height = overlay.clientHeight;
      const w = overlay.width;
      const h = overlay.height;
      ctx.clearRect(0, 0, w, h);
      if (!showGrid) return;

      // 細かいマス目（薄い白線）
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 1;
      const step = 40;
      for (let x = w / 2; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
      for (let x = w / 2; x > 0; x -= step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
      for (let y = h / 2; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
      for (let y = h / 2; y > 0; y -= step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

      // 中心の十字線（赤線：体の軸・肩の高さ確認用）
      ctx.strokeStyle = 'rgba(255, 50, 50, 0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
      ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
      ctx.stroke();
    }

    async function startCamera() {
      statusText.innerText = "カメラ起動中...";
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: useFront ? "user" : "environment" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        statusText.innerText = "稼働中（赤線を体の中心・肩の高さに合わせてください）";
        drawGrid();
      } catch (err) {
        statusText.innerText = "カメラエラー: " + err.message;
      }
    }

    document.getElementById('startBtn').addEventListener('click', startCamera);
    
    document.getElementById('switchBtn').addEventListener('click', () => {
      useFront = !useFront;
      startCamera();
    });

    document.getElementById('gridBtn').addEventListener('click', () => {
      showGrid = !showGrid;
      drawGrid();
    });

    document.getElementById('snapBtn').addEventListener('click', () => {
      if (!video.videoWidth) {
        statusText.innerText = "先にカメラを開始してください";
        return;
      }
      const saveCanvas = document.createElement('canvas');
      saveCanvas.width = video.videoWidth;
      saveCanvas.height = video.videoHeight;
      const sCtx = saveCanvas.getContext('2d');
      sCtx.drawImage(video, 0, 0, saveCanvas.width, saveCanvas.height);

      if (showGrid) {
        const w = saveCanvas.width;
        const h = saveCanvas.height;
        sCtx.strokeStyle = 'rgba(255, 50, 50, 0.85)';
        sCtx.lineWidth = Math.max(3, w / 200);
        sCtx.beginPath();
        sCtx.moveTo(w / 2, 0); sCtx.lineTo(w / 2, h);
        sCtx.moveTo(0, h / 2); sCtx.lineTo(w, h / 2);
        sCtx.stroke();
      }

      const link = document.createElement('a');
      link.download = 'posture_' + new Date().getTime() + '.png';
      link.href = saveCanvas.toDataURL('image/png');
      link.click();
      statusText.innerText = "ガイド線付きで写真を保存しました！";
    });

    window.addEventListener('resize', drawGrid);
    drawGrid();
  </script>
</body>
</html>
