<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>姿勢解析アプリ</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
    .container { position: relative; width: 100vw; max-width: 600px; margin: 0 auto; }
    video, canvas { width: 100%; height: auto; display: block; border-radius: 8px; }
    canvas { position: absolute; top: 0; left: 0; }
    .controls { padding: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button { padding: 12px 20px; font-size: 16px; border: none; border-radius: 8px; background: #00c853; color: #fff; font-weight: bold; cursor: pointer; }
    button#switchBtn { background: #2979ff; }
    #status { width: 100%; margin-top: 8px; font-size: 14px; color: #ffeb3b; }
  </style>
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
</head>
<body>
  <div class="controls">
    <button id="startBtn">カメラを開始</button>
    <button id="switchBtn">前面 / 背面 切替</button>
    <div id="status">「カメラを開始」ボタンを押してください</div>
  </div>
  <div class="container">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    let useFrontCamera = false;
    let currentStream = null;
    let isRunning = false;

    const pose = new Pose({
      locateFile: (file) => `https://jsdelivr.net{file}`
    });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

    pose.onResults((results) => {
      if (video.videoWidth > 0) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (results.poseLandmarks) {
        statusText.innerText = "骨格を検知中！";
        drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00FF00', lineWidth: 4 });
        drawLandmarks(ctx, results.poseLandmarks, { color: '#FF0000', lineWidth: 2, radius: 4 });
      } else {
        statusText.innerText = "カメラに全身または上半身を映してください";
      }
      ctx.restore();
    });

    async function startCamera() {
      statusText.innerText = "カメラとAIを準備中...";
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      const constraints = {
        video: { facingMode: useFrontCamera ? "user" : "environment" },
        audio: false
      };
      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        await video.play();
        if (!isRunning) {
          isRunning = true;
          detectFrame();
        }
      } catch (err) {
        statusText.innerText = "カメラエラー: " + err.message;
      }
    }

    async function detectFrame() {
      if (video.readyState >= 2) {
        await pose.send({ image: video });
      }
      requestAnimationFrame(detectFrame);
    }

    document.getElementById('startBtn').addEventListener('click', startCamera);
    document.getElementById('switchBtn').addEventListener('click', () => {
      useFrontCamera = !useFrontCamera;
      startCamera();
    });
  </script>
</body>
</html>
