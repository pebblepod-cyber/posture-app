<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>姿勢解析アプリ</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
    .container { position: relative; width: 100vw; max-width: 600px; margin: 0 auto; }
    video, canvas { width: 100%; height: auto; display: block; border-radius: 8px; }
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    .controls { padding: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button { padding: 12px 20px; font-size: 16px; border: none; border-radius: 8px; background: #00c853; color: #fff; font-weight: bold; cursor: pointer; }
    button#switchBtn { background: #2979ff; }
    #status { width: 100%; margin-top: 8px; font-size: 14px; color: #ffeb3b; }
  </style>
</head>
<body>
  <div class="controls">
    <button id="startBtn" onclick="startCamera()">カメラを開始</button>
    <button id="switchBtn" onclick="switchCamera()">前面 / 背面 切替</button>
    <div id="status">準備完了！「カメラを開始」を押してください</div>
  </div>
  <div class="container">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    let useFrontCamera = false;
    let currentStream = null;
    let poseLandmarker = null;
    let isRunning = false;

    async function startCamera() {
      statusText.innerText = "カメラを起動中...";
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      const constraints = {
        video: { facingMode: useFrontCamera ? "user" : "environment" },
        audio: false
      };
      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        await video.play();
        statusText.innerText = "カメラ起動成功！骨格AIを読み込み中...";
        if (!poseLandmarker) {
          loadAI();
        }
      } catch (err) {
        statusText.innerText = "カメラエラー: " + err.name + " - " + err.message;
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      startCamera();
    }

    async function loadAI() {
      try {
        const visionModule = await import("https://jsdelivr.net");
        const { PoseLandmarker, FilesetResolver, DrawingUtils } = visionModule;
        const vision = await FilesetResolver.forVisionTasks("https://jsdelivr.net");
        poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://googleapis.com",
            delegate: "CPU"
          },
          runningMode: "VIDEO",
          numPoses: 1
        });
        window.DrawingUtils = DrawingUtils;
        window.PoseLandmarker = PoseLandmarker;
        statusText.innerText = "骨格AI準備完了！人を映してください";
        if (!isRunning) {
          isRunning = true;
          detectFrame();
        }
      } catch (e) {
        statusText.innerText = "AI読込エラー: " + e.message;
      }
    }

    let lastVideoTime = -1;
    function detectFrame() {
      if (poseLandmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const results = poseLandmarker.detectForVideo(video, performance.now());
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (results.landmarks && results.landmarks.length > 0) {
          statusText.innerText = "骨格を検知中！";
          const drawingUtils = new window.DrawingUtils(ctx);
          for (const landmark of results.landmarks) {
            drawingUtils.drawConnectors(landmark, window.PoseLandmarker.POSE_CONNECTIONS, { color: '#00FF00', lineWidth: 4 });
            drawingUtils.drawLandmarks(landmark, { color: '#FF0000', lineWidth: 2, radius: 4 });
          }
        }
        ctx.restore();
      }
      requestAnimationFrame(detectFrame);
    }
  </script>
</body>
</html>
