<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>姿勢チェックカメラ Ver.1.3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    .header { padding: 8px; background: #1e1e1e; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; z-index: 10; }
    button { padding: 10px 12px; font-size: 13px; border: none; border-radius: 8px; font-weight: bold; color: #fff; cursor: pointer; }
    #startBtn { background: #00c853; }
    #switchBtn { background: #2979ff; }
    #modeBtn { background: #ff9100; }
    #resetBtn { background: #607d8b; }
    #snapBtn { background: #e91e63; }
    .viewer { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; touch-action: none; }
    video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    canvas#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #status { width: 100%; text-align: center; font-size: 12px; color: #ffeb3b; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <button id="startBtn">カメラ開始</button>
    <button id="switchBtn">切替</button>
    <button id="modeBtn">ガイド線</button>
    <button id="resetBtn">リセット</button>
    <button id="snapBtn">撮影（保存）</button>
    <div id="status">【Ver.1.3】「カメラ開始」を押してください</div>
  </div>

  <div class="viewer">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
  </div>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const statusText = document.getElementById('status');
    const modeBtn = document.getElementById('modeBtn');

    let useFront = false;
    let stream = null;
    let mode = 'grid';

    let cxRatio = 0.5;
    let cyRatio = 0.5;
    let dragging = false;

    let pt1 = null;
    let pt2 = null;

    function drawOverlay(targetCtx, w, h, scale) {
      if (mode === 'off') return;

      if (mode === 'grid') {
        const cx = w * cxRatio;
        const cy = h * cyRatio;

        targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        targetCtx.lineWidth = 1 * scale;
        const step = 40 * scale;
        for (let x = cx; x < w; x += step) { targetCtx.beginPath(); targetCtx.moveTo(x, 0); targetCtx.lineTo(x, h); targetCtx.stroke(); }
        for (let x = cx; x > 0; x -= step) { targetCtx.beginPath(); targetCtx.moveTo(x, 0); targetCtx.lineTo(x, h); targetCtx.stroke(); }
        for (let y = cy; y < h; y += step) { targetCtx.beginPath(); targetCtx.moveTo(0, y); targetCtx.lineTo(w, y); targetCtx.stroke(); }
        for (let y = cy; y > 0; y -= step) { targetCtx.beginPath(); targetCtx.moveTo(0, y); targetCtx.lineTo(w, y); targetCtx.stroke(); }

        targetCtx.strokeStyle = 'rgba(255, 50, 50, 0.9)';
        targetCtx.lineWidth = 2 * scale;
        targetCtx.beginPath();
        targetCtx.moveTo(cx, 0); targetCtx.lineTo(cx, h);
        targetCtx.moveTo(0, cy); targetCtx.lineTo(w, cy);
        targetCtx.stroke();

        targetCtx.beginPath();
        targetCtx.arc(cx, cy, 10 * scale, 0, Math.PI * 2);
        targetCtx.stroke();
      }

      if (mode === 'angle') {
        if (pt1) {
          targetCtx.fillStyle = '#00e676';
          targetCtx.beginPath();
          targetCtx.arc(pt1.x * w, pt1.y * h, 8 * scale, 0, Math.PI * 2);
          targetCtx.fill();
        }
        if (pt2) {
          targetCtx.fillStyle = '#00e676';
          targetCtx.beginPath();
          targetCtx.arc(pt2.x * w, pt2.y * h, 8 * scale, 0, Math.PI * 2);
          targetCtx.fill();
        }
        if (pt1 && pt2) {
          const x1 = pt1.x * w;
          const y1 = pt1.y * h;
          const x2 = pt2.x * w;
          const y2 = pt2.y * h;

          targetCtx.strokeStyle = '#ffea00';
          targetCtx.lineWidth = 3 * scale;
          targetCtx.beginPath();
          targetCtx.moveTo(x1, y1);
          targetCtx.lineTo(x2, y2);
          targetCtx.stroke();

          const dx = Math.abs(x2 - x1);
          const dy = Math.abs(y2 - y1);
          const deg = (dx >= dy) ? Math.atan2(dy, dx) * 180 / Math.PI : Math.atan2(dx, dy) * 180 / Math.PI;
          const label = ((dx >= dy) ? "水平傾き: " : "垂直傾き: ") + deg.toFixed(1) + "°";

          const mx = (x1 + x2) / 2;
          const my = (y1 + y2) / 2 - 18 * scale;
          targetCtx.font = "bold " + Math.round(16 * scale) + "px sans-serif";
          const tw = targetCtx.measureText(label).width;
          targetCtx.fillStyle = 'rgba(0,0,0,0.75)';
          targetCtx.fillRect(mx - tw / 2 - 6 * scale, my - 16 * scale, tw + 12 * scale, 24 * scale);
          targetCtx.fillStyle = '#ffea00';
          targetCtx.textAlign = 'center';
          targetCtx.fillText(label, mx, my);
        }
      }
    }

    function drawGrid() {
      overlay.width = overlay.clientWidth;
      overlay.height = overlay.clientHeight;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      drawOverlay(ctx, overlay.width, overlay.height, 1);
    }

    overlay.addEventListener('pointerdown', (e) => {
      const r = overlay.getBoundingClientRect();
      const rx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      const ry = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));

      if (mode === 'grid') {
        dragging = true;
        cxRatio = rx;
        cyRatio = ry;
        drawGrid();
      } else if (mode === 'angle') {
        if (!pt1 || (pt1 && pt2)) {
          pt1 = { x: rx, y: ry };
          pt2 = null;
          statusText.innerText = "【Ver.1.3】2点目をタップしてください";
        } else {
          pt2 = { x: rx, y: ry };
          statusText.innerText = "【Ver.1.3】角度を計測しました";
        }
        drawGrid();
      }
    });

    overlay.addEventListener('pointermove', (e) => {
      if (!dragging || mode !== 'grid') return;
      const r = overlay.getBoundingClientRect();
      cxRatio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      cyRatio = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
      drawGrid();
    });

    overlay.addEventListener('pointerup', () => { dragging = false; });
    overlay.addEventListener('pointercancel', () => { dragging = false; });

    async function startCamera() {
      statusText.innerText = "【Ver.1.3】カメラを起動中...";
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: useFront ? "user" : "environment" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        statusText.innerText = "【Ver.1.3】稼働中";
        drawGrid();
      } catch (err) {
        statusText.innerText = "【Ver.1.3】エラー: " + err.message;
      }
    }

    document.getElementById('startBtn').addEventListener('click', startCamera);
    document.getElementById('switchBtn').addEventListener('click', () => { useFront = !useFront; startCamera(); });

    modeBtn.addEventListener('click', () => {
      if (mode === 'grid') {
        mode = 'angle';
        modeBtn.innerText = "角度計測";
        modeBtn.style.background = "#00bfa5";
        statusText.innerText = "【Ver.1.3】2点をタップしてください";
      } else if (mode === 'angle') {
        mode = 'off';
        modeBtn.innerText = "線なし";
        modeBtn.style.background = "#757575";
        statusText.innerText = "【Ver.1.3】ガイド線：OFF";
      } else {
        mode = 'grid';
        modeBtn.innerText = "ガイド線";
        modeBtn.style.background = "#ff9100";
        statusText.innerText = "【Ver.1.3】画面なぞりで赤線移動";
      }
      drawGrid();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      cxRatio = 0.5;
      cyRatio = 0.5;
      pt1 = null;
      pt2 = null;
      drawGrid();
      statusText.innerText = "【Ver.1.3】リセットしました";
    });

    document.getElementById('snapBtn').addEventListener('click', () => {
      if (!video.videoWidth) {
        statusText.innerText = "【Ver.1.3】先に「カメラ開始」を押してください";
        return;
      }
      const saveCanvas = document.createElement('canvas');
      saveCanvas.width = video.videoWidth;
      saveCanvas.height = video.videoHeight;
      const sCtx = saveCanvas.getContext('2d');
      sCtx.drawImage(video, 0, 0, saveCanvas.width, saveCanvas.height);

      const scale = Math.max(1, saveCanvas.width / 400);
      drawOverlay(sCtx, saveCanvas.width, saveCanvas.height, scale);

      const link = document.createElement('a');
      link.download = 'posture_' + new Date().getTime() + '.png';
      link.href = saveCanvas.toDataURL('image/png');
      link.click();
      statusText.innerText = "【Ver.1.3】写真を保存しました！";
    });

    window.addEventListener('resize', drawGrid);
    drawGrid();
  </script>
</body>
</html>
